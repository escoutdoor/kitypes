<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f9fafb;">
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 40px; border-radius: 16px; border: 1px solid #e5e7eb; border-top: 6px solid #3b82f6;">
        <h2 style="color: #111827; margin-top: 0;">Новий запит у підтримку</h2>
        
        <div style="background-color: #f3f4f6; padding: 16px; border-radius: 8px; margin: 20px 0;">
            <p style="margin: 0 0 8px 0; color: #374151;"><strong>Тема:</strong> {{.Subject}}</p>
            <p style="margin: 0 0 8px 0; color: #374151;">
                <strong>Від:</strong> <a href="mailto:{{.UserEmail}}" style="color: #3b82f6;">{{.UserEmail}}</a>
            </p>
            {{if .UserID}}
            <p style="margin: 0; color: #374151;"><strong>ID Користувача:</strong> <code style="background-color: #e5e7eb; padding: 2px 6px; border-radius: 4px;">{{.UserID}}</code></p>
            {{else}}
            <p style="margin: 0; color: #6b7280; font-style: italic;">Незареєстрований користувач (Гість)</p>
            {{end}}
        </div>

        <h3 style="color: #111827; margin-bottom: 12px;">Повідомлення:</h3>
        <div style="background-color: #ffffff; border: 1px solid #e5e7eb; padding: 20px; border-radius: 12px; white-space: pre-wrap; color: #4B5563; font-size: 15px; line-height: 1.6;">{{.Message}}</div>
        
        <div style="margin-top: 30px; text-align: center;">
            <a href="mailto:{{.UserEmail}}" style="background-color: #3b82f6; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">Відповісти користувачу</a>
        </div>
    </div>
</body>
</html>
