<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відновлення пароля</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f9fafb;">
    <div style="font-family: Arial, sans-serif; max-w: 600px; margin: 40px auto; background-color: #ffffff; padding: 40px; border-radius: 16px; border: 1px solid #e5e7eb;">
        <h2 style="color: #111827; margin-top: 0;">Відновлення пароля KityPes 🐾</h2>
        <p style="color: #4B5563; font-size: 16px; line-height: 1.5;">
            Ви отримали цей лист, оскільки був запит на скидання пароля для вашого акаунта.
        </p>
        <p style="color: #4B5563; font-size: 16px; line-height: 1.5;">
            Натисніть на кнопку нижче, щоб встановити новий пароль. Посилання дійсне 15 хвилин.
        </p>
        <div style="text-align: center; margin: 35px 0;">
            <a href="{{.ResetLink}}" style="background-color: #f97316; color: white; padding: 14px 28px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; display: inline-block;">
                Відновити пароль
            </a>
        </div>
        <p style="color: #9CA3AF; font-size: 13px; line-height: 1.5; margin-bottom: 0;">
            Якщо ви не робили цього запиту, просто проігноруйте цей лист. Ваш акаунт у безпеці.
        </p>
    </div>
</body>
</html>
